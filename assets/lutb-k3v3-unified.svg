<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">K3V3 on Vera Rubin LUT-B: one recipe, two attention cache architectures</title>
  <desc id="desc">Everything is drawn in neutral tones except the LUT-B path: the 3-bit compressed caches and the two UTCQMMA.LUTB matrix multiplies are highlighted in violet with dashed rings, showing exactly where in-core lookup MMA runs. Top band: the shared recipe. Bottom panels: GQA compresses separate K-transpose and V caches; MLA compresses one shared 512-d latent feeding both multiplies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f1"/>
      <stop offset="1" stop-color="#f4f1e4"/>
    </linearGradient>
    <linearGradient id="rubin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3a3323" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a8371"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans SC", Arial, sans-serif; fill: #23211b; }
      .subtitle { font: 500 17px Inter, "Noto Sans SC", Arial, sans-serif; fill: #6e6a5c; }
      .panel-title { font: 700 22px Inter, "Noto Sans SC", Arial, sans-serif; fill: #2e2b23; }
      .band-title { font: 700 18px Inter, "Noto Sans SC", Arial, sans-serif; fill: #3d3a30; }
      .label { font: 700 16px Inter, "Noto Sans SC", Arial, sans-serif; fill: #2e2b23; }
      .small { font: 500 13px Inter, "Noto Sans SC", Arial, sans-serif; fill: #5f5b4d; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", Arial, sans-serif; fill: #7a7565; }
      .vlabel { font: 700 16px Inter, "Noto Sans SC", Arial, sans-serif; fill: #4c1d95; }
      .vsmall { font: 500 13px Inter, "Noto Sans SC", Arial, sans-serif; fill: #5b21b6; }
      .vtiny { font: 600 12px Inter, "Noto Sans SC", Arial, sans-serif; fill: #6d28d9; }
      .mono { font: 700 15px "JetBrains Mono", Menlo, monospace; }
      .white { fill: #fff; }
      .step { font: 800 15px Inter, Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #8a8371; stroke-width: 2.5; marker-end: url(#arrow); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrowPurple); }
      .halo { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 7 5; }
      .nbox { fill: #faf8ef; stroke: #b6ae95; stroke-width: 1.5; }
      .nbox2 { fill: #f1eee0; stroke: #b6ae95; stroke-width: 1.5; }
      .vbox { fill: url(#cache); stroke: #7c3aed; stroke-width: 1.8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="title">K3V3 on Rubin LUT-B: one recipe, two cache architectures</text>
  <text x="48" y="86" class="subtitle">Violet = the LUT-B path (3-bit cache + in-core lookup MMA). Everything else is a standard-precision step.</text>

  <!-- ======================= shared recipe band ======================= -->
  <rect x="44" y="110" width="1512" height="222" rx="20" fill="#fffdf6" stroke="#cfc8b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="146" class="band-title">SHARED RECIPE &#8212; write the cache once, read it at every decode step</text>

  <!-- write path row -->
  <rect x="70" y="164" width="320" height="60" rx="12" class="nbox"/>
  <text x="230" y="188" class="label" text-anchor="middle">Offline per-layer Lloyd-Max</text>
  <text x="230" y="210" class="small" text-anchor="middle">8 E4M3 centroids &#183; optional OSCAR R + clip</text>
  <path d="M390 194 H424" class="line"/>
  <rect x="427" y="164" width="368" height="60" rx="12" class="vbox"/>
  <text x="611" y="188" class="vlabel" text-anchor="middle">Pack 3-bit LUT-B granules</text>
  <text x="611" y="210" class="vsmall" text-anchor="middle">512 &#215; 3-bit idx + 8 &#215; E4M3 LUT = 200 B &#8594; 3.125 bit/value</text>
  <path d="M795 194 H829" class="line"/>
  <rect x="832" y="164" width="290" height="60" rx="12" class="nbox2" stroke-dasharray="6 4"/>
  <text x="977" y="188" class="label" text-anchor="middle">BF16 safety window</text>
  <text x="977" y="210" class="small" text-anchor="middle">sink 64 + recent 256 + unfinished blocks</text>
  <rect x="1152" y="164" width="380" height="60" rx="12" class="nbox"/>
  <text x="1342" y="188" class="label" text-anchor="middle">Runtime writes are cheap</text>
  <text x="1342" y="210" class="small" text-anchor="middle">no fitting at serving time &#8212; only nearest-index assignment</text>

  <!-- decode path row -->
  <rect x="70" y="252" width="250" height="60" rx="12" class="nbox"/>
  <text x="195" y="276" class="label" text-anchor="middle">A: Q, then P &#183; MXFP8</text>
  <text x="195" y="298" class="small" text-anchor="middle">E4M3 + UE8M0 block32 scale</text>
  <path d="M320 282 H354" class="line"/>
  <path d="M611 224 V246" class="purple-line"/>
  <rect x="350" y="245" width="344" height="74" rx="15" class="halo"/>
  <rect x="357" y="252" width="330" height="60" rx="12" fill="url(#rubin)"/>
  <text x="522" y="277" class="mono white" text-anchor="middle">UTCQMMA.LUTB &#215; 2</text>
  <text x="522" y="299" class="small white" text-anchor="middle">the only place 3-bit data is decompressed</text>
  <path d="M694 282 H728" class="line"/>
  <rect x="731" y="252" width="283" height="60" rx="12" class="nbox"/>
  <text x="872" y="276" class="label" text-anchor="middle">FP32 softmax between MMAs</text>
  <text x="872" y="298" class="small" text-anchor="middle">max / exp / sum &#183; P stays on chip</text>
  <rect x="1044" y="252" width="488" height="60" rx="12" class="vbox"/>
  <text x="1288" y="276" class="vlabel" text-anchor="middle">B is the only compressed operand</text>
  <text x="1288" y="298" class="vsmall" text-anchor="middle">collector reuse B_KEEP &#8594; B_REUSE serves 4 GQA Q heads per K/V tile</text>

  <!-- ======================= GQA panel ======================= -->
  <rect x="44" y="356" width="736" height="454" rx="22" fill="#fffdf6" stroke="#cfc8b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="72" y="394" class="panel-title">GQA / MHA &#8212; two caches, two codebooks</text>
  <text x="72" y="420" class="small">Qwen &amp; Gemma full attention &#183; optional independent R_k / R_v</text>

  <circle cx="88" cy="476" r="17" fill="#857c66"/>
  <text x="88" y="476" class="step">1</text>
  <rect x="116" y="450" width="112" height="52" rx="11" class="nbox2"/>
  <text x="172" y="473" class="label" text-anchor="middle">K post-RoPE</text>
  <text x="172" y="493" class="tiny" text-anchor="middle">rotate with R_k</text>
  <rect x="116" y="516" width="112" height="52" rx="11" class="nbox2"/>
  <text x="172" y="539" class="label" text-anchor="middle">V</text>
  <text x="172" y="559" class="tiny" text-anchor="middle">rotate with R_v</text>
  <path d="M228 476 H286" class="line"/>
  <path d="M228 542 H252 V498 H286" class="line"/>
  <rect x="289" y="450" width="196" height="118" rx="14" class="nbox"/>
  <text x="387" y="482" class="label" text-anchor="middle">quantize offline</text>
  <text x="387" y="507" class="small" text-anchor="middle">K codebook + R_k</text>
  <text x="387" y="529" class="small" text-anchor="middle">V codebook + R_v</text>
  <text x="387" y="553" class="tiny" text-anchor="middle">sink / recent bypass in BF16</text>
  <path d="M485 509 H523" class="purple-line"/>
  <rect x="526" y="450" width="228" height="118" rx="14" class="vbox"/>
  <text x="640" y="480" class="vlabel" text-anchor="middle">two LUT-B caches</text>
  <text x="640" y="506" class="vsmall" text-anchor="middle">INT3 K^T &#8594; B of MMA 1</text>
  <text x="640" y="529" class="vsmall" text-anchor="middle">INT3 V &#8594; B of MMA 2</text>
  <text x="640" y="553" class="tiny" text-anchor="middle">K stored physically transposed</text>

  <!-- violet feed arrows: cache -> both MMAs -->
  <path d="M560 568 V584 H312 V596" class="purple-line"/>
  <path d="M700 568 V596" class="purple-line"/>
  <text x="436" y="579" class="vtiny" text-anchor="middle">operand B</text>

  <circle cx="88" cy="646" r="17" fill="#857c66"/>
  <text x="88" y="646" class="step">2</text>
  <rect x="116" y="620" width="86" height="52" rx="11" class="nbox2"/>
  <text x="159" y="652" class="label" text-anchor="middle">Q</text>
  <path d="M202 646 H234" class="line"/>
  <rect x="230" y="603" width="164" height="86" rx="16" class="halo"/>
  <rect x="237" y="610" width="150" height="72" rx="13" fill="url(#rubin)"/>
  <text x="312" y="639" class="label white" text-anchor="middle">Q &#215; K^T</text>
  <text x="312" y="662" class="tiny white" text-anchor="middle">LUT-B MMA 1</text>
  <path d="M394 646 H420" class="line"/>
  <rect x="446" y="620" width="102" height="52" rx="11" class="nbox"/>
  <text x="497" y="652" class="label" text-anchor="middle">FP32 P</text>
  <path d="M548 646 H578" class="line"/>
  <rect x="600" y="603" width="168" height="86" rx="16" class="halo"/>
  <rect x="607" y="610" width="154" height="72" rx="13" fill="url(#rubin)"/>
  <text x="684" y="639" class="label white" text-anchor="middle">P &#215; V</text>
  <text x="684" y="662" class="tiny white" text-anchor="middle">LUT-B MMA 2</text>

  <rect x="116" y="716" width="638" height="66" rx="13" class="nbox2"/>
  <text x="435" y="743" class="label" text-anchor="middle">Result: standard attention output (optional inverse R_v)</text>
  <text x="435" y="766" class="small" text-anchor="middle">Two caches per layer &#183; one K/V tile serves 4 Q heads via B_KEEP &#8594; B_REUSE</text>

  <!-- ======================= MLA panel ======================= -->
  <rect x="820" y="356" width="736" height="454" rx="22" fill="#fffdf6" stroke="#cfc8b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="848" y="394" class="panel-title">MLA &#8212; one shared latent, one codebook</text>
  <text x="848" y="420" class="small">Kimi K3 &#183; 24 Gated-MLA layers &#183; rotation absorbed into projections</text>

  <circle cx="864" cy="476" r="17" fill="#857c66"/>
  <text x="864" y="476" class="step">1</text>
  <rect x="892" y="450" width="160" height="60" rx="11" class="nbox2"/>
  <text x="972" y="476" class="label" text-anchor="middle">c_KV latent</text>
  <text x="972" y="498" class="small" text-anchor="middle">512-d, shared by K and V</text>
  <path d="M1052 480 H1090" class="line"/>
  <rect x="1093" y="450" width="196" height="60" rx="11" class="nbox"/>
  <text x="1191" y="476" class="label" text-anchor="middle">quantize offline</text>
  <text x="1191" y="498" class="small" text-anchor="middle">one codebook + one R_latent</text>
  <path d="M1289 480 H1327" class="purple-line"/>
  <rect x="1330" y="444" width="200" height="72" rx="11" class="vbox"/>
  <text x="1430" y="470" class="vlabel" text-anchor="middle">one INT3 latent</text>
  <text x="1430" y="492" class="vsmall" text-anchor="middle">B of MMA 1 as c_KV^T</text>
  <text x="1430" y="510" class="vsmall" text-anchor="middle">B of MMA 2 as c_KV</text>
  <rect x="892" y="530" width="408" height="44" rx="10" class="nbox2" stroke-dasharray="6 4"/>
  <text x="1096" y="548" class="small" text-anchor="middle">Native bypass (never quantized):</text>
  <text x="1096" y="566" class="tiny" text-anchor="middle">69 KDA states + 64-d RoPE suffix</text>

  <!-- violet feed arrows: latent -> both MMAs -->
  <path d="M1400 516 V584 H1124 V596" class="purple-line"/>
  <path d="M1492 516 V596" class="purple-line"/>
  <text x="1262" y="579" class="vtiny" text-anchor="middle">operand B</text>

  <circle cx="864" cy="646" r="17" fill="#857c66"/>
  <text x="864" y="646" class="step">2</text>
  <rect x="892" y="620" width="122" height="52" rx="11" class="nbox2"/>
  <text x="953" y="645" class="label" text-anchor="middle">absorbed Q</text>
  <text x="953" y="665" class="tiny" text-anchor="middle">latent basis + RoPE term</text>
  <path d="M1014 646 H1042" class="line"/>
  <rect x="1042" y="603" width="164" height="86" rx="16" class="halo"/>
  <rect x="1049" y="610" width="150" height="72" rx="13" fill="url(#rubin)"/>
  <text x="1124" y="639" class="label white" text-anchor="middle">Q &#215; c_KV^T</text>
  <text x="1124" y="662" class="tiny white" text-anchor="middle">LUT-B MMA 1</text>
  <path d="M1206 646 H1234" class="line"/>
  <rect x="1258" y="620" width="102" height="52" rx="11" class="nbox"/>
  <text x="1309" y="652" class="label" text-anchor="middle">FP32 P</text>
  <path d="M1360 646 H1390" class="line"/>
  <rect x="1412" y="603" width="132" height="86" rx="16" class="halo"/>
  <rect x="1419" y="610" width="118" height="72" rx="13" fill="url(#rubin)"/>
  <text x="1478" y="639" class="label white" text-anchor="middle">P &#215; c_KV</text>
  <text x="1478" y="662" class="tiny white" text-anchor="middle">LUT-B MMA 2</text>

  <rect x="892" y="716" width="638" height="66" rx="13" class="nbox2"/>
  <text x="1211" y="743" class="label" text-anchor="middle">Value up-projection &#8594; attention output</text>
  <text x="1211" y="766" class="small" text-anchor="middle">One cache and one codebook per layer &#183; expanded K/V never materialized</text>

  <!-- ======================= footer legend ======================= -->
  <rect x="200" y="840" width="1200" height="40" rx="11" fill="#fffdf6" stroke="#cfc8b2"/>
  <rect x="228" y="852" width="16" height="16" rx="4" fill="url(#rubin)"/>
  <text x="252" y="865" class="tiny">LUT-B MMA &#8212; in-core 3-bit lookup</text>
  <circle cx="478" cy="860" r="8" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="494" y="865" class="tiny">dashed ring = where it runs</text>
  <rect x="682" y="852" width="16" height="16" rx="4" fill="url(#cache)" stroke="#7c3aed"/>
  <text x="706" y="865" class="tiny">3-bit compressed cache (operand B)</text>
  <rect x="946" y="852" width="16" height="16" rx="4" class="nbox2"/>
  <text x="970" y="865" class="tiny">standard-precision step (MXFP8 A, FP32 softmax, BF16 window)</text>
</svg>
